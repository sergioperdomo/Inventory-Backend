#  Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Teamopapa$00
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  JPA / Hibernate
# create-drop: borra y recrea el schema en cada arranque (útil en desarrollo)
# update: sólo aplica cambios al schema existente
# validate: sólo valida sin modificar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#  Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Servidor
server.port=8080
spring.application.name=inventory-backend

#  JWT
# Clave secreta (mínimo 32 caracteres)
jwt.secret=InventarioSecretKey2024XyZ987654321Ab
# Expiración en milisegundos: 86400000 = 24 horas
jwt.expiration=86400000